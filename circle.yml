machine:
  node:
    version: 8.1.3
  services:
    - docker

dependencies:
  override:
    - yarn install

test:
  override:
    - docker run -d -p 9000:9000 --memory=4g skywidesoft/corenlp-chinese:3.7.0
    - curl --retry 10 --retry-delay 5 -v http://localhost:9000
    - yarn lint
    - yarn test
